[profile.default]
src = "src"
test = "test"
out = "out"
libs = ["lib"]
solc_version = "0.8.24"
optimizer = true
optimizer_runs = 200

via_ir = true
evm_version = "shanghai"


# Explicit, network-backed integration profile. Kept separate so plain `forge test`
# remains deterministic and does not require RPC access.
[profile.fork]
test = "fork-test"
