services:
  morpho-llm-operator:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: morpho-llm-operator
    restart: unless-stopped
    env_file:
      - ./tools/.env
    # Keep the in-container listener fixed at 3000; set WATCH_HTTP_HOST_PORT in the
    # repository-root .env or shell to choose the host-side port.
    ports:
      - "${WATCH_HTTP_HOST_PORT:-3000}:3000"
    volumes:
      - ./evm/deployments.json:/app/evm/deployments.json
      - ./tools/logs:/app/tools/logs
    logging:
      driver: "json-file"
      options:
        max-size: "25m"
        max-file: "5"
