services:
  morpho-llm-operator:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: morpho-llm-operator
    restart: unless-stopped
    # Directory mount supports atomic registry replacement; regenerate masked build artifacts.
    command: ["sh", "-c", "npm run compile:contracts && exec npm run watch -- --http-port 3000"]
    healthcheck:
      start_period: 90s
    env_file:
      - ./tools/.env
    environment:
      WATCH_HTTP_PORT: "3000"
    ports:
      - "${WATCH_HTTP_HOST_PORT:-3000}:3000"
    volumes:
      - ./evm:/app/evm
      - ./tools/logs:/app/tools/logs
    logging:
      driver: "json-file"
      options:
        max-size: "25m"
        max-file: "5"
