services:
  morpho-llm-operator:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: morpho-llm-operator
    restart: unless-stopped
    env_file:
      - ./tools/.env
    ports:
      - "${WATCH_HTTP_PORT:-3000}:3000"
    volumes:
      - ./evm/deployments.json:/app/evm/deployments.json
      - ./tools/logs:/app/tools/logs
    logging:
      driver: "json-file"
      options:
        max-size: "25m"
        max-file: "5"
